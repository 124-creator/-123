name: EEX v7 bounded evidence integration checks
on:
  push:
    branches: [eex-integrated-v7-20261010]
    paths:
      - 'research/eex_integration_checks_20261010/run_checks.py'
      - '.github/workflows/eex-v7-bounded-checks.yml'
permissions:
  contents: write
jobs:
  bounded-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eex-integrated-v7-20261010
          fetch-depth: 1
      - name: Install bounded numerical dependencies
        run: |
          python3 -m venv /tmp/eex-v7-venv
          /tmp/eex-v7-venv/bin/pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 PyMuPDF==1.26.7
      - name: Execute protocol without replacing old outputs
        run: |
          /tmp/eex-v7-venv/bin/python -B research/eex_integration_checks_20261010/run_checks.py
      - name: Publish only new diagnostics and source receipts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/eex-integrated-v7-20261010 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/eex_integration_checks_20261010/results
          git commit -m 'research: publish finite short-axis sensitivity and official download receipts'
          git push origin HEAD:refs/heads/eex-integrated-v7-20261010
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eex-v7-bounded-checks
          retention-days: 7
          path: research/eex_integration_checks_20261010/results
