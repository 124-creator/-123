name: EEX v8 reviewed editorial documents
on:
  push:
    branches: [eex-editorial-v8-20261010]
    paths:
      - 'paper/eex_manuscript_v8_20261010/source_payload/**'
      - '.github/workflows/eex-v8-editorial-documents.yml'
permissions:
  contents: write
jobs:
  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eex-editorial-v8-20261010
          fetch-depth: 1
      - name: Install document-only dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-croscore fonts-liberation libreoffice-writer python3-venv
          python3 -m venv /tmp/eex-v8-env
          /tmp/eex-v8-env/bin/pip install --disable-pip-version-check python-docx==1.2.0 lxml==6.1.1
          curl --fail --location --max-time 120 https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-amd64.tar.gz -o /tmp/eex-pandoc.tar.gz
          tar -xzf /tmp/eex-pandoc.tar.gz -C /tmp
          sudo install /tmp/pandoc-3.1.11.1/bin/pandoc /usr/local/bin/pandoc
      - name: Verify reviewed sources and edit original document objects
        run: |
          python3 paper/eex_manuscript_v8_20261010/source_payload/materialize.py
          /tmp/eex-v8-env/bin/python -B paper/eex_manuscript_v8_20261010/tools/revise_v8.py --source paper/eex_manuscript_v7_20261010 --out paper/eex_manuscript_v8_20261010 --plan paper/eex_manuscript_v8_20261010/REVISION_PLAN.json
          /tmp/eex-v8-env/bin/python -B paper/eex_manuscript_v8_20261010/source_payload/export_readable.py
      - name: Export journal supplement PDF
        run: |
          mkdir -p /tmp/eex-v8-pdf /tmp/eex-v8-home
          HOME=/tmp/eex-v8-home timeout 240 libreoffice -env:UserInstallation=file:///tmp/eex-v8-profile --headless --convert-to pdf --outdir /tmp/eex-v8-pdf paper/eex_manuscript_v8_20261010/ONLINE_RESOURCE_1_v8.docx
          test -s /tmp/eex-v8-pdf/ONLINE_RESOURCE_1_v8.pdf
          cp /tmp/eex-v8-pdf/ONLINE_RESOURCE_1_v8.pdf paper/eex_manuscript_v8_20261010/ESM_1.pdf
      - name: Commit only the new manuscript directory
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/eex-editorial-v8-20261010 | cut -f1)" = "$GITHUB_SHA"
          find paper/eex_manuscript_v8_20261010 -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- paper/eex_manuscript_v8_20261010
          git diff --cached --name-only | grep -v '^paper/eex_manuscript_v8_20261010/' && exit 1 || true
          git commit -m 'paper: publish verified v8 editorial manuscript and evidence-status map'
          git push origin HEAD:refs/heads/eex-editorial-v8-20261010
      - name: Attach documents for independent readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eex-v8-reviewed-documents
          retention-days: 7
          path: |
            paper/eex_manuscript_v8_20261010/*.docx
            paper/eex_manuscript_v8_20261010/*.md
            paper/eex_manuscript_v8_20261010/ESM_1.pdf
            paper/eex_manuscript_v8_20261010/support/CI_DOCUMENT_QA.json
            paper/eex_manuscript_v8_20261010/support/DOCUMENT_QA_V8.json
            paper/eex_manuscript_v8_20261010/support/SOURCE_TRANSFER_QA.json
