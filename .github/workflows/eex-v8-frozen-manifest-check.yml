name: EEX v8 frozen-manifest check
on:
  push:
    branches: [eex-editorial-v8-20261010]
    paths: ['.github/workflows/eex-v8-frozen-manifest-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eex-editorial-v8-20261010
          fetch-depth: 1
      - name: Read-only repository verification
        run: |
          test "$(git hash-object scripts/verify_repository.py)" = e279b6a8a8ae7faa42d47533d2fa5e171fad0a22
          set +e
          python3 scripts/verify_repository.py > paper/eex_manuscript_v8_20261010/support/FROZEN_MANIFEST_CHECK.json
          rc=$?
          set -e
          echo "$rc" > paper/eex_manuscript_v8_20261010/support/FROZEN_MANIFEST_CHECK_EXIT.txt
          cat paper/eex_manuscript_v8_20261010/support/FROZEN_MANIFEST_CHECK.json
      - name: Publish verification result only
        run: |
          test "$(git ls-remote origin refs/heads/eex-editorial-v8-20261010 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/eex_manuscript_v8_20261010/support/FROZEN_MANIFEST_CHECK.json paper/eex_manuscript_v8_20261010/support/FROZEN_MANIFEST_CHECK_EXIT.txt
          git commit -m 'paper: record frozen-manifest verification separately from editorial checks'
          git push origin HEAD:refs/heads/eex-editorial-v8-20261010
