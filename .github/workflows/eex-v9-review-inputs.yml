name: EEX v9 fixed public review inputs
on:
  push:
    branches: [eex-price-integrated-v9-20261011]
    paths: ['.github/workflows/eex-v9-review-inputs.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Extract only pinned public review materials
        run: |
          set -eu
          mkdir -p /tmp/eex-v9-inputs
          git fetch --depth=1 origin 955f694ccc76396e5af90166da8a921cd210a104
          git archive 955f694ccc76396e5af90166da8a921cd210a104 paper/eex_reported_price_v8_2_20261011 | tar -x -C /tmp/eex-v9-inputs
          git fetch --depth=1 origin 33707c164c80accd7acf9fcd3f0965088a8370f6
          git archive 33707c164c80accd7acf9fcd3f0965088a8370f6 research/eua_price_description_followup_20261011 research/eua_local_price_execution_20261011 research/eua_official_cutoff_pilot_20261011 | tar -x -C /tmp/eex-v9-inputs
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/eex-v9-inputs')
          files={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'TRANSFER.json').write_text(json.dumps({'scope':'Existing public manuscript and aggregate results only; no private rows; no code execution','manuscript_commit':'955f694ccc76396e5af90166da8a921cd210a104','evidence_commit':'33707c164c80accd7acf9fcd3f0965088a8370f6','files':files},indent=2))
          print('Public files packaged:',len(files))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eex-v9-fixed-public-inputs
          path: /tmp/eex-v9-inputs/
          retention-days: 7
