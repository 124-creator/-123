name: EEX v9 final reviewed delivery
on:
  push:
    branches: [eex-price-integrated-v9-20261011]
    paths: ['.github/workflows/eex-v9-final-readback.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eex-price-integrated-v9-20261011
          fetch-depth: 1
      - name: Preserve exact reviewed documents and finalize the source locator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          p=Path('paper/eex_price_integrated_v9_20261011')
          expected={'MANUSCRIPT_EN_v9.docx':'ce6b68f22d88454d35a534a99b0b1561d0207a550dc31666f0f37e00c424e789','ONLINE_RESOURCE_1_v9.docx':'7e6de1b5e9045d3f0343c323f6e34ffb7209d0dc8fd9d9e64fcff22598a82830','TITLE_PAGE_v9.docx':'97a79285d4f88287f5e04e2fa88442e15372b1e89b9b88ef146e26b7561a0527','MANUSCRIPT_EN_v9.pdf':'180e4a30886456394992b62abaccebacbe8805035f1026fb757e1baa3e685a99','ESM_1.pdf':'9c5c4abeaf71ea451f26acfd4aef8075972a2f1e5a2f18e41aee17f27daab713','TITLE_PAGE_v9.pdf':'1c397aa5afdca3df616cb90b9537b6cd0e65f5e078bf4ede87586d6b42061e4c'}
          for n,h in expected.items():
              if hashlib.sha256((p/n).read_bytes()).hexdigest()!=h:raise ValueError('Reviewed document changed: '+n)
          src=p/'tables/PRICE_NUMERIC_SOURCE_LEDGER.csv'; dst=p/'tables/PRICE_DISPLAY_LEDGER.csv'
          if hashlib.sha256(src.read_bytes()).hexdigest()!='7b3947b856c07ae6831c870db13b7141057e8079c31fad3187250f2de1023a6c':raise ValueError('Ledger source changed')
          if dst.exists():raise FileExistsError(str(dst))
          shutil.copyfile(src,dst)
          receipt={'date':'2026-10-11','scope':'Complete manuscript integration and public aggregate arithmetic audit, not private-row market refitting','branch':'eex-price-integrated-v9-20261011','manuscript_base_commit':'955f694ccc76396e5af90166da8a921cd210a104','price_results_commit':'fccd471de96548bd781c59aced4a59435aae08ac','description_commit':'33707c164c80accd7acf9fcd3f0965088a8370f6','document_build_commit':'7122aa7d5f34aed2755819d45dfbe06197594899','finalization_source_commit':os.environ['GITHUB_SHA'],'document_workflow_run':38141318871,'document_workflow_success':True,'reviewed_artifact_id':11703525879,'reviewed_artifact_sha256':'22f6c8ee1504f2455e15c21e56aef1e85a0350005b31270a5ffa413039606b9d','reviewed_artifact_payload_files':47,'reviewed_artifact_total_members_including_manifest':48,'CRC_and_member_hashes_passed':True,'three_docx_exactly_equal_to_locally_reviewed':True,'all_remote_pdf_pages_visually_opened_by_assistant':{'main':17,'supplement':13,'title':1},'observed_clipping_missing_equations_or_overlap':False,'remote_pdfs_pixel_equal_to_local_reconversion':False,'native_Microsoft_Word_or_WPS_test':False,'original_main_math_preserved':51,'new_native_main_equation':1,'original_SI_math_preserved':58,'repaired_whole_word_subscripts_preserved':True,'main_numbered_tables':6,'main_figures':3,'SI_numbered_tables':14,'abstract_words':216,'keywords':6,'public_manifest_files_checked':45,'public_arithmetic_identity_checks':228,'stored_wild_t_statistics_read':999,'new_market_fits':0,'new_bootstrap_fits':0,'new_private_row_descriptive_calculations':0,'root_repository_source_manifest_check':{'files_checked':80,'passed':True},'numeric_source_locator_entries':391,'ledger_locator_fix':'PRICE_DISPLAY_LEDGER.csv is an exact-byte alias of PRICE_NUMERIC_SOURCE_LEDGER.csv, resolving the existing SI S8 locator without regenerating any DOCX or PDF. Both contain the same 391 records.','files_sha256':expected,'funding':'No financial support, user-confirmed','Wang_preceding_review':'User-confirmed; not reset to unknown','raw_data_republished':False,'old_files_modified':False,'main_merged':False,'journal_submitted':False,'CAS_qualification_authenticated':False,'submission_ready':False,'open_items':['actual author contributions','competing interests','lawful exact-snapshot data access','target-journal contribution judgment']}
          (p/'PUBLICATION_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Exact documents retained; all 31 remote PDF pages previously visually reviewed; source-locator alias resolved.')
          PY
      - name: Commit only receipt and exact ledger alias
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/eex-price-integrated-v9-20261011 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- paper/eex_price_integrated_v9_20261011/PUBLICATION_RECEIPT.json paper/eex_price_integrated_v9_20261011/tables/PRICE_DISPLAY_LEDGER.csv
          git commit -m 'delivery: record completed v9 readback and resolve exact numeric-ledger alias'
          git push origin HEAD:refs/heads/eex-price-integrated-v9-20261011
      - name: Package reviewed final files without raw data or transfer payloads
        run: |
          mkdir -p /tmp/eex-v9-final/paper /tmp/eex-v9-final/research
          cp -R paper/eex_price_integrated_v9_20261011 /tmp/eex-v9-final/paper/
          cp -R research/eex_aggregate_review_20261011 /tmp/eex-v9-final/research/
          rm -rf /tmp/eex-v9-final/paper/eex_price_integrated_v9_20261011/source_payload
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          r=Path('/tmp/eex-v9-final')
          files={str(x.relative_to(r)):{'bytes':x.stat().st_size,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted(r.rglob('*')) if x.is_file()}
          (r/'DELIVERY_MANIFEST.json').write_text(json.dumps({'scope':'Final manuscript, public aggregate records and editorial code; no raw price data or source PDFs or fonts','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':files},indent=2))
          print('Final payload files:',len(files))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eex-v9-final-reviewed-delivery
          path: /tmp/eex-v9-final/
          retention-days: 7
