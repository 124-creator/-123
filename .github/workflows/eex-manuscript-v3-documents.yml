name: EEX manuscript v3 documents only
on:
  push:
    branches: [eex-manuscript-v3-20261010]
    paths:
      - '.github/workflows/eex-manuscript-v3-documents.yml'
      - 'paper/eex_manuscript_v3_20261010/MANUSCRIPT_EN.md'
      - 'paper/eex_manuscript_v3_20261010/ONLINE_RESOURCE_1.md'
      - 'paper/eex_manuscript_v3_20261010/tools/**'
      - 'paper/eex_manuscript_v3_20261010/support/figure_data.json'
      - 'paper/eex_manuscript_v3_20261010/support/DISPLAY_LOCK.json'
permissions:
  contents: write
concurrency:
  group: eex-manuscript-v3-build
  cancel-in-progress: false
jobs:
  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Install document-only build dependencies
        run: |
          set -euo pipefail
          curl --fail --location --max-time 90 -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          python3 -m venv /tmp/eex-v3-docs
          /tmp/eex-v3-docs/bin/pip install python-docx==1.2.0 lxml==6.1.1 matplotlib==3.10.8 numpy==2.3.5 pillow==12.3.0
      - name: Verify reviewed text and build Word without experiments
        run: |
          set -euo pipefail
          p=paper/eex_manuscript_v3_20261010
          /tmp/eex-v3-docs/bin/python "$p/tools/verify_display_lock.py"
          /tmp/eex-v3-docs/bin/python "$p/tools/build_figures.py"
          /tmp/eex-v3-docs/bin/python "$p/tools/build_manuscript.py"
          /tmp/eex-v3-docs/bin/python "$p/tools/verify_display_lock.py" --built
          /tmp/eex-v3-docs/bin/python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          p=Path('paper/eex_manuscript_v3_20261010')
          files=[p/'MANUSCRIPT_EN_v3.docx',p/'ONLINE_RESOURCE_1_v3.docx']+sorted((p/'figures').glob('*'))
          receipt={'scope':'document compilation only; no statistics fitted','source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'python':platform.python_version(),'pandoc':subprocess.check_output(['pandoc','--version'],text=True).splitlines()[0],'new_fits':0,'semantic_lock_passed':True,'files':[{'path':str(f.relative_to(p)),'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in files]}
          (p/'support/ci_build_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Publish only generated manuscript documents on this branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'eex-manuscript-v3-20261010'
          p=paper/eex_manuscript_v3_20261010
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p/MANUSCRIPT_EN_v3.docx" "$p/ONLINE_RESOURCE_1_v3.docx" "$p/figures" "$p/support/build_receipt.json" "$p/support/ci_build_receipt.json"
          if ! git diff --cached --quiet; then
            git commit -m 'paper: build v3 Word and frozen-value figures with semantic checks'
            git push origin HEAD:refs/heads/eex-manuscript-v3-20261010
          fi
      - name: Attach generated documents for independent readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eex-manuscript-v3-built-documents
          retention-days: 7
          path: |
            paper/eex_manuscript_v3_20261010/MANUSCRIPT_EN_v3.docx
            paper/eex_manuscript_v3_20261010/ONLINE_RESOURCE_1_v3.docx
            paper/eex_manuscript_v3_20261010/figures/
            paper/eex_manuscript_v3_20261010/support/ci_build_receipt.json
